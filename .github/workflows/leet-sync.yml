name: Sync LeetCode

on:
  schedule:
    - cron: "17 23 * * *"   # daily, 23:17 UTC
  workflow_dispatch:         # "Run workflow" button
  push:                      # rebuild README when you add a file by hand
    branches: [main]
    paths-ignore: ["README.md", ".sync/**"]

permissions:
  contents: write

concurrency:
  group: leetcode-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Sync submissions and rebuild README
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          STUDY_PLANS: leetcode-75
        run: python3 .github/scripts/sync.py

      - name: Commit changes
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && echo "Nothing to commit" && exit 0
          git commit -m "Sync LeetCode solutions"
          git push
